[project]
name = "leakproof"
version = "0.1.0"
description = "Leak-Proofing Loop: attack, detect and harden an LLM against leaking secrets."
requires-python = ">=3.11"
dependencies = [
    "faker>=25",
    "openai>=1.40",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rf --tb=line"
